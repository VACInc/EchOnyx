# AMD GPU override (Strix Halo / ROCm) - use with: docker compose -f docker-compose.yml -f docker-compose.amd.yml up

services:
  vision-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vs-vision
    restart: unless-stopped
    ports:
      - "8081:8080"
    command:
      - -m
      - /models/Qwen3VL-32B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-32B-Instruct-F16.gguf
      - -c
      - "8192"
      - -ngl
      - "0"
      - --host
      - 0.0.0.0
    volumes:
      - model_cache:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build:
      args:
        ROCM_WHL_URL: ${ROCM_WHL_URL:-https://repo.radeon.com/rocm/manylinux/rocm-rel-7.1/}
        ROCM_TORCH_VERSION: ${ROCM_TORCH_VERSION:-2.8.0+rocm7.1.0.lw.git7a520360}
        ROCM_TORCHAUDIO_VERSION: ${ROCM_TORCHAUDIO_VERSION:-2.8.0+rocm7.1.0.git6e1c7fe9}
        ROCM_TORCHVISION_VERSION: ${ROCM_TORCHVISION_VERSION:-0.23.0+rocm7.1.0.git824e8c87}
        ROCM_NIGHTLY: ${ROCM_NIGHTLY:-0}
        LLAMA_BUILD_VULKAN: ${LLAMA_BUILD_VULKAN:-0}
        LLAMA_BUILD_HIPBLAS: ${LLAMA_BUILD_HIPBLAS:-1}
        INSTALL_NEMO: ${INSTALL_NEMO:-0}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /opt/rocm:/opt/rocm:ro
      - /opt/rocm-7.1.0:/opt/rocm-7.1.0:ro
    group_add:
      - "44"   # video group
      - "993"  # render group
    environment:
      - GPU_BACKEND=${GPU_BACKEND:-rocm}
      - HARDWARE_PROFILE=strix_halo
      - HSA_OVERRIDE_GFX_VERSION=11.5.1  # For Strix Halo gfx1151
      - VULKAN_DEVICE=0
      - MODEL_LOADING=${MODEL_LOADING:-sequential}
      - ROCM_PATH=/opt/rocm
      - LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm-7.1.0/lib:/opt/rocm-7.1.0/lib64
      - VISION_ENDPOINT_URL=http://vision-server:8080/v1
      - VISION_ENDPOINT_MODEL=Qwen3VL-32B-Instruct-Q4_K_M.gguf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-server:
        condition: service_healthy

  worker:
    build:
      args:
        ROCM_WHL_URL: ${ROCM_WHL_URL:-https://repo.radeon.com/rocm/manylinux/rocm-rel-7.1/}
        ROCM_TORCH_VERSION: ${ROCM_TORCH_VERSION:-2.8.0+rocm7.1.0.lw.git7a520360}
        ROCM_TORCHAUDIO_VERSION: ${ROCM_TORCHAUDIO_VERSION:-2.8.0+rocm7.1.0.git6e1c7fe9}
        ROCM_TORCHVISION_VERSION: ${ROCM_TORCHVISION_VERSION:-0.23.0+rocm7.1.0.git824e8c87}
        ROCM_NIGHTLY: ${ROCM_NIGHTLY:-0}
        LLAMA_BUILD_VULKAN: ${LLAMA_BUILD_VULKAN:-0}
        LLAMA_BUILD_HIPBLAS: ${LLAMA_BUILD_HIPBLAS:-1}
        INSTALL_NEMO: ${INSTALL_NEMO:-0}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /opt/rocm:/opt/rocm:ro
      - /opt/rocm-7.1.0:/opt/rocm-7.1.0:ro
    group_add:
      - "44"   # video group
      - "993"  # render group
    environment:
      - GPU_BACKEND=${GPU_BACKEND:-rocm}
      - HARDWARE_PROFILE=strix_halo
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
      - VULKAN_DEVICE=0
      - MODEL_LOADING=${MODEL_LOADING:-sequential}
      - ROCM_PATH=/opt/rocm
      - LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm-7.1.0/lib:/opt/rocm-7.1.0/lib64
      - VISION_ENDPOINT_URL=http://vision-server:8080/v1
      - VISION_ENDPOINT_MODEL=Qwen3VL-32B-Instruct-Q4_K_M.gguf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-server:
        condition: service_healthy
