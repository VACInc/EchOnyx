# NVIDIA GPU override - use with: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up

x-cuda-build: &cuda-build
  context: ./backend
  dockerfile: Dockerfile.cuda
  args:
    CUDA_WHL_URL: ${CUDA_WHL_URL:-https://download.pytorch.org/whl/cu128}
    CUDA_TORCH_VERSION: ${CUDA_TORCH_VERSION:-2.9.1}
    CUDA_TORCHAUDIO_VERSION: ${CUDA_TORCHAUDIO_VERSION:-2.9.1}
    CUDA_TORCHVISION_VERSION: ${CUDA_TORCHVISION_VERSION:-0.24.1}
    CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-all-major}
    LLAMA_BUILD_CUDA: ${LLAMA_BUILD_CUDA:-1}
    INSTALL_NEMO: ${INSTALL_NEMO:-1}

x-cuda-service: &cuda-service
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vision-server:
    <<: *cuda-service
    image: ${NVIDIA_VISION_VLLM_IMAGE:-vllm/vllm-openai:v0.11.2}
    container_name: vs-vision
    restart: unless-stopped
    env_file:
      - .env
    ipc: host
    entrypoint:
      - /bin/bash
      - -lc
      - |
        export CUDA_DEVICE_ORDER=PCI_BUS_ID
        if [ -n "${NVIDIA_VISION_VISIBLE_DEVICES:-}" ]; then
          export CUDA_VISIBLE_DEVICES="${NVIDIA_VISION_VISIBLE_DEVICES}"
        fi
        exec vllm serve "${VISION_VLLM_MODEL_ID:-Qwen/Qwen3-VL-30B-A3B-Instruct-FP8}" \
          --served-model-name "${VISION_ENDPOINT_MODEL:-Qwen3VL-32B-Instruct-Q4_K_M.gguf}" \
          --host 0.0.0.0 \
          --port 8000 \
          --gpu-memory-utilization "${VISION_VLLM_GPU_MEMORY_UTILIZATION:-0.8}" \
          --max-model-len "${VISION_CONTEXT_SIZE:-8192}"
    environment:
      - NVIDIA_VISION_VISIBLE_DEVICES=${NVIDIA_VISION_VISIBLE_DEVICES:-}
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
    volumes:
      - vllm_cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  summarization-server:
    <<: *cuda-service
    build: *cuda-build
    container_name: vs-summary
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /bin/bash
      - -lc
      - |
        export CUDA_DEVICE_ORDER=PCI_BUS_ID
        if [ -n "${NVIDIA_SUMMARIZATION_VISIBLE_DEVICES:-}" ]; then
          export CUDA_VISIBLE_DEVICES="${NVIDIA_SUMMARIZATION_VISIBLE_DEVICES}"
        fi
        python -m app.runtime.llama_cpp_server
    environment:
      - MODEL_PATH=/data/models/${SUMMARIZATION_MODEL_PATH:-qwen3-30b-a3b-q4_k_m.gguf}
      - MODEL_NAME=${SUMMARIZATION_ENDPOINT_MODEL:-qwen3-30b-a3b-q4_k_m.gguf}
      - MODEL_CONTEXT_SIZE=${SUMMARIZATION_CONTEXT_SIZE:-32768}
      - MODEL_GPU_LAYERS=${SUMMARIZATION_GPU_LAYERS:-999}
      - NVIDIA_SUMMARIZATION_VISIBLE_DEVICES=${NVIDIA_SUMMARIZATION_VISIBLE_DEVICES:-}
      - LLAMA_SERVER_EXTRA_ARGS=${SUMMARIZATION_LLAMA_SERVER_EXTRA_ARGS:-}
    volumes:
      - ./data:/data
      - model_cache:/data/models

  backend:
    <<: *cuda-service
    build: *cuda-build
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - GPU_BACKEND=cuda
      - VISION_ENDPOINT_URL=http://vision-server:8000/v1
      - VISION_ENDPOINT_MODEL=${VISION_ENDPOINT_MODEL:-Qwen3VL-32B-Instruct-Q4_K_M.gguf}
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8000/v1
      - SUMMARIZATION_ENDPOINT_MODEL=${SUMMARIZATION_ENDPOINT_MODEL:-qwen3-30b-a3b-q4_k_m.gguf}
    depends_on:
      vision-server:
        condition: service_started
      summarization-server:
        condition: service_started

  worker:
    <<: *cuda-service
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo -Q video_processing,batch_processing,default
    build: *cuda-build
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - GPU_BACKEND=cuda
      - VISION_ENDPOINT_URL=http://vision-server:8000/v1
      - VISION_ENDPOINT_MODEL=${VISION_ENDPOINT_MODEL:-Qwen3VL-32B-Instruct-Q4_K_M.gguf}
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8000/v1
      - SUMMARIZATION_ENDPOINT_MODEL=${SUMMARIZATION_ENDPOINT_MODEL:-qwen3-30b-a3b-q4_k_m.gguf}
    depends_on:
      vision-server:
        condition: service_started
      summarization-server:
        condition: service_started

volumes:
  vllm_cache:
