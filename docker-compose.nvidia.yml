# NVIDIA GPU override - use with: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - GPU_BACKEND=cuda
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}

  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - GPU_BACKEND=cuda
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3,4,5,6}
