[project]
name = "echonyx"
version = "0.1.0"
description = "Local video and presentation summarization system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "websockets>=13.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Vector store
    "chromadb>=0.5.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Audio/Video processing
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.3.0",
    "scenedetect[opencv]>=0.6.0",
    "ffmpeg-python>=0.2.0",

    # LLM inference
    "llama-cpp-python @ git+https://github.com/abetlen/llama-cpp-python.git",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Model downloading
    "huggingface_hub>=0.25.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "sacrebleu>=2.4.0",

    # Granite LoRA support
    "peft>=0.13.0",

    # Export formats
    "markdown>=3.7",
    "reportlab>=4.2.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# GPU-specific backends (install separately based on hardware)
cuda = [
    "llama-cpp-python[cuda] @ git+https://github.com/abetlen/llama-cpp-python.git",
]
vulkan = [
    "llama-cpp-python @ git+https://github.com/abetlen/llama-cpp-python.git",  # Build with VULKAN flag
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
