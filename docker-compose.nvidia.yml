# NVIDIA GPU override - use with: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up

x-cuda-build: &cuda-build
  context: ./backend
  dockerfile: Dockerfile.cuda
  args:
    CUDA_WHL_URL: ${CUDA_WHL_URL:-https://download.pytorch.org/whl/cu128}
    CUDA_TORCH_VERSION: ${CUDA_TORCH_VERSION:-2.9.1}
    CUDA_TORCHAUDIO_VERSION: ${CUDA_TORCHAUDIO_VERSION:-2.9.1}
    CUDA_TORCHVISION_VERSION: ${CUDA_TORCHVISION_VERSION:-0.24.1}
    CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-all-major}
    LLAMA_BUILD_CUDA: ${LLAMA_BUILD_CUDA:-1}
    INSTALL_NEMO: ${INSTALL_NEMO:-1}

x-cuda-service: &cuda-service
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # CUDA-native default (core directive: best engine + best model for the
  # platform): CUDA llama.cpp serving the largest downloaded Q4 candidate
  # that fits the selected GPU, swapped in and out by the managed runtime.
  # For large-VRAM hosts preferring vLLM full precision, start the
  # vision-server-vllm profile instead and point VISION_ENDPOINT_URL at it.
  vision-server:
    <<: *cuda-service
    build: *cuda-build
    container_name: vs-vision
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - -m
      - app.runtime.managed_openai_runtime
    environment:
      - PORT=8000
      - MODEL_RUNTIME=command
      - MODEL_COMMAND=python -m app.runtime.llama_cpp_server
      - MODEL_CANDIDATES_JSON=${VISION_MODEL_CANDIDATES_JSON:-[{"model":"/models/Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf","mmproj":"/models/mmproj-Qwen3VL-30B-A3B-Instruct-Q8_0.gguf","memory_gb":21},{"model":"/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf","mmproj":"/models/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf","memory_gb":7}]}
      - MODEL_PATH=${VISION_MODEL_PATH:-/models/Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf}
      - MODEL_MMPROJ=${VISION_MMPROJ_PATH:-/models/mmproj-Qwen3VL-30B-A3B-Instruct-Q8_0.gguf}
      - MODEL_NAME=${VISION_ENDPOINT_MODEL:-Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf}
      - MODEL_CONTEXT_SIZE=${VISION_CONTEXT_SIZE:-8192}
      - MODEL_GPU_LAYERS=${VISION_GPU_LAYERS:-999}
      - SERVICE_ROLE=vision
      - AUTO_NVIDIA_GPU_SELECTION=1
      - MODEL_MEMORY_GB=${VISION_ENDPOINT_ESTIMATED_MEMORY_GB:-21}
      - PEER_MODEL_MEMORY_GB=${SUMMARIZATION_ENDPOINT_ESTIMATED_MEMORY_GB:-20}
      - HOT_SET_MEMORY_GB=${NVIDIA_ENDPOINT_HOT_SET_MEMORY_GB:-41}
      - IDLE_TIMEOUT_SECONDS=${NVIDIA_ENDPOINT_IDLE_TIMEOUT_SECONDS:-300}
      - NVIDIA_VISION_VISIBLE_DEVICES=${NVIDIA_VISION_VISIBLE_DEVICES:-}
      - LLAMA_SERVER_EXTRA_ARGS=${VISION_LLAMA_SERVER_EXTRA_ARGS:-}
    volumes:
      - ./data:/data
      - model_cache:/data/models
      - model_cache:/models:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  vision-server-vllm:
    <<: *cuda-service
    profiles: ["vision-vllm"]
    image: ${NVIDIA_VISION_VLLM_IMAGE:-vllm/vllm-openai:v0.17.1}
    container_name: vs-vision-vllm
    restart: unless-stopped
    env_file:
      - .env
    ipc: host
    entrypoint:
      - /bin/bash
      - -lc
      - exec python3 /opt/echonyx-runtime/managed_openai_runtime.py
    environment:
      - PORT=8000
      - MODEL_RUNTIME=vllm
      - MODEL_NAME=${VISION_ENDPOINT_MODEL:-Qwen/Qwen3-VL-30B-A3B-Instruct-FP8}
      - VLLM_MODEL_ID=${VISION_VLLM_MODEL_ID:-Qwen/Qwen3-VL-30B-A3B-Instruct-FP8}
      - MODEL_CONTEXT_SIZE=${VISION_CONTEXT_SIZE:-8192}
      - VLLM_EXTRA_ARGS=--gpu-memory-utilization ${VISION_VLLM_GPU_MEMORY_UTILIZATION:-0.8}
      - SERVICE_ROLE=vision
      - AUTO_NVIDIA_GPU_SELECTION=1
      - MODEL_MEMORY_GB=${VISION_VLLM_ESTIMATED_MEMORY_GB:-62}
      - PEER_MODEL_MEMORY_GB=${SUMMARIZATION_ENDPOINT_ESTIMATED_MEMORY_GB:-20}
      - HOT_SET_MEMORY_GB=${NVIDIA_ENDPOINT_HOT_SET_MEMORY_GB:-86}
      - IDLE_TIMEOUT_SECONDS=${NVIDIA_ENDPOINT_IDLE_TIMEOUT_SECONDS:-300}
      - NVIDIA_VISION_VISIBLE_DEVICES=${NVIDIA_VISION_VISIBLE_DEVICES:-}
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
    volumes:
      - vllm_cache:/root/.cache/huggingface
      - ./backend/app/runtime:/opt/echonyx-runtime:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  summarization-server:
    <<: *cuda-service
    build: *cuda-build
    container_name: vs-summary
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - -m
      - app.runtime.managed_openai_runtime
    environment:
      - PORT=8000
      - MODEL_RUNTIME=command
      - MODEL_COMMAND=python -m app.runtime.llama_cpp_server
      - MODEL_PATH=${SUMMARIZATION_MODEL_PATH:-/models/Qwen3-30B-A3B-Q4_K_M.gguf}
      - MODEL_NAME=${SUMMARIZATION_ENDPOINT_MODEL:-Qwen3-30B-A3B-Q4_K_M.gguf}
      - MODEL_CONTEXT_SIZE=${SUMMARIZATION_CONTEXT_SIZE:-32768}
      - MODEL_GPU_LAYERS=${SUMMARIZATION_GPU_LAYERS:-999}
      - SERVICE_ROLE=summarization
      - AUTO_NVIDIA_GPU_SELECTION=1
      - MODEL_MEMORY_GB=${SUMMARIZATION_ENDPOINT_ESTIMATED_MEMORY_GB:-20}
      - PEER_MODEL_MEMORY_GB=${VISION_ENDPOINT_ESTIMATED_MEMORY_GB:-21}
      - HOT_SET_MEMORY_GB=${NVIDIA_ENDPOINT_HOT_SET_MEMORY_GB:-86}
      - IDLE_TIMEOUT_SECONDS=${NVIDIA_ENDPOINT_IDLE_TIMEOUT_SECONDS:-300}
      - NVIDIA_SUMMARIZATION_VISIBLE_DEVICES=${NVIDIA_SUMMARIZATION_VISIBLE_DEVICES:-}
      - LLAMA_SERVER_EXTRA_ARGS=${SUMMARIZATION_LLAMA_SERVER_EXTRA_ARGS:-}
    volumes:
      - ./data:/data
      - model_cache:/data/models
      - model_cache:/models:ro

  backend:
    <<: *cuda-service
    build: *cuda-build
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - GPU_BACKEND=cuda
      - VISION_ENDPOINT_URL=${VISION_ENDPOINT_URL:-http://vision-server:8000/v1}
      - VISION_ENDPOINT_MODEL=${VISION_ENDPOINT_MODEL:-Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf}
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8000/v1
      - SUMMARIZATION_ENDPOINT_MODEL=${SUMMARIZATION_ENDPOINT_MODEL:-Qwen3-30B-A3B-Q4_K_M.gguf}
    depends_on:
      vision-server:
        condition: service_started
      summarization-server:
        condition: service_started

  worker:
    <<: *cuda-service
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo -Q video_processing,batch_processing,default
    build: *cuda-build
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - GPU_BACKEND=cuda
      - VISION_ENDPOINT_URL=${VISION_ENDPOINT_URL:-http://vision-server:8000/v1}
      - VISION_ENDPOINT_MODEL=${VISION_ENDPOINT_MODEL:-Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf}
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8000/v1
      - SUMMARIZATION_ENDPOINT_MODEL=${SUMMARIZATION_ENDPOINT_MODEL:-Qwen3-30B-A3B-Q4_K_M.gguf}
    depends_on:
      vision-server:
        condition: service_started
      summarization-server:
        condition: service_started

volumes:
  vllm_cache:
