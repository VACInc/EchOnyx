# AMD GPU override (Strix Halo / ROCm) - use with:
# docker compose -f docker-compose.yml -f docker-compose.amd.yml up

x-rocm-llama-server: &rocm-llama-server
  build:
    context: .
    dockerfile: docker/rocm-llama-server/Dockerfile
    args:
      ROCM_DEV_IMAGE: ${ROCM_DEV_IMAGE:-rocm/dev-ubuntu-24.04:7.2-complete}
      AMD_LLAMA_PACKAGE_URL: ${AMD_LLAMA_PACKAGE_URL:-https://repo.radeon.com/rocm/llama.cpp/linux/rocm-rel-7.2/llama-b7782-ubuntu-24.04-rocm-7.2.0-gfx110X-gfx115X-gfx120X-x64.zip}
  restart: unless-stopped
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "44"   # video group
    - "993"  # render group
  environment:
    - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.5.1}
  volumes:
    - model_cache:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 20
    start_period: 90s

services:
  vision-server:
    <<: *rocm-llama-server
    container_name: vs-vision
    ports:
      - "8081:8080"
    command:
      - -m
      - /models/Qwen3VL-32B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-32B-Instruct-F16.gguf
      - -c
      - "8192"
      - -ngl
      - "999"
      - -np
      - "1"
      - --host
      - 0.0.0.0

  summarization-server:
    <<: *rocm-llama-server
    container_name: vs-summary
    ports:
      - "8080:8080"
    command:
      - -m
      - /models/qwen3-30b-a3b-q4_k_m.gguf
      - -c
      - "32768"
      - -ngl
      - "999"
      - -np
      - "1"
      - --host
      - 0.0.0.0

  backend:
    build:
      args:
        ROCM_WHL_URL: ${ROCM_WHL_URL:-https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/}
        ROCM_TORCH_VERSION: ${ROCM_TORCH_VERSION:-2.10.0+rocm7.2.0.lw.gitb6ee5fde}
        ROCM_TORCHAUDIO_VERSION: ${ROCM_TORCHAUDIO_VERSION:-2.10.0+rocm7.2.0.git5047768f}
        ROCM_TORCHVISION_VERSION: ${ROCM_TORCHVISION_VERSION:-0.25.0+rocm7.2.0.git82df5f59}
        ROCM_NIGHTLY: ${ROCM_NIGHTLY:-0}
        LLAMA_BUILD_VULKAN: ${LLAMA_BUILD_VULKAN:-0}
        LLAMA_BUILD_HIPBLAS: ${LLAMA_BUILD_HIPBLAS:-1}
        INSTALL_NEMO: ${INSTALL_NEMO:-0}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /opt/rocm:/opt/rocm:ro
    group_add:
      - "44"   # video group
      - "993"  # render group
    environment:
      - GPU_BACKEND=${GPU_BACKEND:-rocm}
      - HARDWARE_PROFILE=strix_halo
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.5.1}
      - MODEL_LOADING=${MODEL_LOADING:-sequential}
      - ROCM_PATH=/opt/rocm
      - LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64
      - VISION_ENDPOINT_URL=http://vision-server:8080/v1
      - VISION_ENDPOINT_MODEL=Qwen3VL-32B-Instruct-Q4_K_M.gguf
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8080/v1
      - SUMMARIZATION_ENDPOINT_MODEL=qwen3-30b-a3b-q4_k_m.gguf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-server:
        condition: service_healthy
      summarization-server:
        condition: service_healthy

  worker:
    build:
      args:
        ROCM_WHL_URL: ${ROCM_WHL_URL:-https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/}
        ROCM_TORCH_VERSION: ${ROCM_TORCH_VERSION:-2.10.0+rocm7.2.0.lw.gitb6ee5fde}
        ROCM_TORCHAUDIO_VERSION: ${ROCM_TORCHAUDIO_VERSION:-2.10.0+rocm7.2.0.git5047768f}
        ROCM_TORCHVISION_VERSION: ${ROCM_TORCHVISION_VERSION:-0.25.0+rocm7.2.0.git82df5f59}
        ROCM_NIGHTLY: ${ROCM_NIGHTLY:-0}
        LLAMA_BUILD_VULKAN: ${LLAMA_BUILD_VULKAN:-0}
        LLAMA_BUILD_HIPBLAS: ${LLAMA_BUILD_HIPBLAS:-1}
        INSTALL_NEMO: ${INSTALL_NEMO:-0}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - /opt/rocm:/opt/rocm:ro
    group_add:
      - "44"   # video group
      - "993"  # render group
    environment:
      - GPU_BACKEND=${GPU_BACKEND:-rocm}
      - HARDWARE_PROFILE=strix_halo
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.5.1}
      - MODEL_LOADING=${MODEL_LOADING:-sequential}
      - ROCM_PATH=/opt/rocm
      - LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64
      - VISION_ENDPOINT_URL=http://vision-server:8080/v1
      - VISION_ENDPOINT_MODEL=Qwen3VL-32B-Instruct-Q4_K_M.gguf
      - SUMMARIZATION_ENDPOINT_URL=http://summarization-server:8080/v1
      - SUMMARIZATION_ENDPOINT_MODEL=qwen3-30b-a3b-q4_k_m.gguf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-server:
        condition: service_healthy
      summarization-server:
        condition: service_healthy
